# 本機開發用：Oracle XE 21c + SQL Server 2022
# docker compose -f docker-compose.dev.yml up -d
services:
  oracle:
    image: gvenzl/oracle-xe:21-slim-faststart
    container_name: etltool-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: hr
      APP_USER_PASSWORD: hr
    volumes:
      - oracle-data:/opt/oracle/oradata
    restart: unless-stopped

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: etltool-mssql
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Dev_Password1!"
      MSSQL_PID: "Developer"
    volumes:
      - mssql-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  oracle-data:
  mssql-data:
